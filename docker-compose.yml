services:
  postgres:
    image: postgres:16
    container_name: sql-analyst-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pass
      POSTGRES_DB: chinook
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (avoids clashing with a local Postgres)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # *.sql files run in alphabetical order, first start only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chinook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: